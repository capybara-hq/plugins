packages:
  - plugins/*
  - tools/*
allowBuilds:
  cpu-features: true
  esbuild: true
  msgpackr-extract: false
  protobufjs: true
  ssh2: true
overrides:
  # one plugin-sdk instance: connector e2e checks `instanceof ToolError` across packages
  "@capybara-hq/plugin-sdk": file:./.local-core/capybara-hq-plugin-sdk-0.1.0-rc.69.tgz
  # one plugin-client instance: the host global and the hooks' context are shared by every plugin
  "@capybara-hq/plugin-client": 0.1.0-rc.9
  # one kernel and test kit that match it: an older kernel imports SDK exports R3 removed
  "@capybara-hq/kernel": file:./.local-core/capybara-hq-kernel-0.1.0-rc.84.tgz
  "@capybara-hq/plugin-tools": file:./.local-core/capybara-hq-plugin-tools-0.1.0-rc.23.tgz
  "@capybara-hq/testing": file:./.local-core/capybara-hq-testing-0.1.0-rc.38.tgz
