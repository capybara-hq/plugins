# Slack app manifest for the Capybara Slack plugin (@capybara-hq/plugin-slack).
# Paste it at https://api.slack.com/apps -> Create New App -> From a manifest.
# Reference: https://docs.slack.dev/reference/app-manifest (checked 2026-10-20).
# Socket Mode needs no public request URL; the app-level token (xapp-, scope connections:write)
# is created separately under Basic Information -> App-Level Tokens (see README.md).
display_information:
  name: Capybara
  description: Chat with your organization's Capybara agents.
  background_color: "#3d2f24"
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: capybara
    always_online: true
  # Slack rejects a message starting with an unregistered "/name", so the kernel's commands are
  # registered here. The plugin turns each into the text the kernel parses: /new -> "/new",
  # /env x -> "/env x", /capybara foo bar -> "/foo bar" (skill invocation). No url: Socket Mode
  # delivers them; in webhook mode set each command's Request URL to the webhook URL.
  slash_commands:
    - command: /new
      description: Start a new conversation (direct message)
      should_escape: false
    - command: /env
      description: List or set your default environment (direct message)
      usage_hint: "[name]"
      should_escape: false
    - command: /capybara
      description: Run a skill
      usage_hint: "<skill> [args]"
      should_escape: false
oauth_config:
  # Sign in with Slack (identity-source@1): uncomment and set to <http.publicUrl>/api/v1/auth/sso/slack/callback.
  # The sign-in flow requests openid / email / profile itself; do not add them as scopes here (Slack wants
  # Sign in with Slack scopes in a separate OAuth flow, see README.md).
  # redirect_urls:
  #   - https://capybara.example.com/api/v1/auth/sso/slack/callback
  scopes:
    bot:
      - chat:write # post and update replies and cards
      - commands # slash commands /new, /env, /capybara
      - im:write # conversations.open: tell the bot's own DM from other DMs a slash command runs in
      - im:history # message.im: direct messages to the bot
      - app_mentions:read # app_mention: @capybara in channels
      - channels:history # message.channels: thread replies in public channels
      - groups:history # message.groups: thread replies in private channels
      - users:read # users.info (display name, avatar); team_join / user_change; directory@1 users.list
      - users:read.email # directory@1: email addresses in users.list (the bot itself does not use it)
settings:
  event_subscriptions:
    bot_events:
      - message.im
      - app_mention
      - message.channels
      - message.groups
      - team_join
      - user_change
  interactivity:
    is_enabled: true
  socket_mode_enabled: true
  org_deploy_enabled: false
  token_rotation_enabled: false
