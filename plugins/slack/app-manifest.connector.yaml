# Slack app manifest for the Slack connector of the Capybara Slack plugin (connectors/slack.json).
# A separate internal app "Capybara connector": user scopes only, MCP on, no bot, no Socket Mode.
# Paste it at https://api.slack.com/apps -> Create New App -> From a manifest, in the company
# workspace, after replacing the redirect URL with <http.publicUrl>/api/v1/oauth/callback.
# Leave Manage Distribution off (internal app) and do not enable PKCE (see README.md).
# Reference: https://docs.slack.dev/reference/app-manifest and
# https://docs.slack.dev/ai/slack-mcp-server/ (checked 2026-11-08).
display_information:
  name: Capybara connector
  description: Lets Capybara agents use Slack as you, with your permission.
  background_color: "#3d2f24"
oauth_config:
  redirect_urls:
    - https://capybara.example.com/api/v1/oauth/callback
  scopes:
    # The user scopes Slack's MCP server supports; the connector template asks for exactly these.
    user:
      - search:read.public
      - search:read.private
      - search:read.mpim
      - search:read.im
      - search:read.files
      - search:read.users
      - channels:history
      - groups:history
      - mpim:history
      - im:history
      - channels:read
      - groups:read
      - mpim:read
      - im:read
      - channels:write
      - groups:write
      - mpim:write
      - im:write
      - chat:write
      - canvases:read
      - canvases:write
      - lists:read
      - lists:write
      - files:read
      - files:write
      - reactions:read
      - reactions:write
      - emoji:read
      - users:read
      - users:read.email
settings:
  is_mcp_enabled: true
  org_deploy_enabled: false # true for an Enterprise Grid org-wide install
  socket_mode_enabled: false
  token_rotation_enabled: false
