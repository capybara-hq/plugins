# Docker socket 代理（sandbox-docker 插件的 endpoint）：只放行插件实际调用的 Engine API，其余一律 403。
#
# 用法见 plugins/sandbox-docker/README.md 与 docker/compose.dev.yaml 的 sandbox profile。代理容器挂
# /var/run/docker.sock（只有它挂，内核与插件不挂），以 root 运行（读 socket 要 root）；监听 :2375。
#
# 部署要求（重要）：能访问本代理的人几乎就能控制 Docker。**绝不要把它发布到宿主机的任何地址上**
# （包括 127.0.0.1：Docker Desktop 上普通 bridge 网络里的容器经 host.docker.internal 就能访问宿主机回环；
# Linux 上网桥网关地址也能到达宿主机监听的端口）。生产环境只把它放在内核所在的内部网络上，不映射端口；
# egress 为 open 的沙箱能访问宿主机网络能访问的一切。
#
# 第一道：路径白名单（路径可带 /v1.NN 版本前缀；查询串不参与路径匹配）。容器与卷只认 cap- 开头的名字，
# 网络只认 cap 开头的名字（插件一律按名字访问，从不用 id）；exec 实例 /exec/{id} 无法按名字过滤，
# 但创建 exec 已要求 cap- 容器。
#   GET  /_ping、/version
#   POST /containers/create?name=cap-…；GET /containers/cap-…/json；POST /containers/cap-…/(start|stop|kill|restart|unpause)
#   DELETE /containers/cap-…；POST /containers/cap-…/exec；POST /exec/{id}/start；GET /exec/{id}/json
#   POST /volumes/create；GET|DELETE /volumes/cap-…
#   POST /networks/create；GET|DELETE /networks/cap…
#   GET /images/{name}/json；POST /images/create?fromImage=…（只能拉取镜像：查询串只能是一个 fromImage，
#   不能 fromSrc 导入、repo / tag 改名、message / changes 提交）
# 第二道（纵深防御）：缓冲请求体并按正则拒绝危险字段（特权、bind / 设备 / 加能力、host 命名空间、
# 非 no-new-privileges 的 securityopt、任何 \u 转义与非 ASCII 字节等，见下）。这只是正则兜底，不是 JSON 解析：
# 主要的防线是网络位置（只有内核访问得到本代理），请求体检查只在前者失守时多挡一层。
global
  log stdout format raw local0 info
  maxconn 4096
  # 请求体整个放进缓冲区才能检查；下面限制带体请求不超过 32 KiB
  tune.bufsize 65536

defaults
  mode http
  log global
  option httplog
  option dontlognull
  timeout connect 10s
  timeout http-request 30s
  # exec 的输出流可以长时间没有数据（命令最长 sandbox.limits.maxCommandSeconds，默认 7200 秒）
  timeout client 8h
  timeout server 8h
  timeout tunnel 8h

frontend docker
  bind :2375
  option http-buffer-request

  acl m_get method GET HEAD
  acl m_post method POST
  acl m_delete method DELETE

  acl p_ping path_reg '^(/v1\.[0-9]+)?/(_ping|version)$'
  acl p_container_create path_reg '^(/v1\.[0-9]+)?/containers/create$'
  acl p_container path_reg '^(/v1\.[0-9]+)?/containers/cap-[A-Za-z0-9_.-]+$'
  acl p_container_json path_reg '^(/v1\.[0-9]+)?/containers/cap-[A-Za-z0-9_.-]+/json$'
  acl p_container_op path_reg '^(/v1\.[0-9]+)?/containers/cap-[A-Za-z0-9_.-]+/(start|stop|kill|restart|unpause)$'
  acl p_container_exec path_reg '^(/v1\.[0-9]+)?/containers/cap-[A-Za-z0-9_.-]+/exec$'
  acl p_exec_start path_reg '^(/v1\.[0-9]+)?/exec/[A-Za-z0-9]+/start$'
  acl p_exec_json path_reg '^(/v1\.[0-9]+)?/exec/[A-Za-z0-9]+/json$'
  acl p_volume_create path_reg '^(/v1\.[0-9]+)?/volumes/create$'
  acl p_volume path_reg '^(/v1\.[0-9]+)?/volumes/cap-[A-Za-z0-9_.-]+$'
  acl p_network_create path_reg '^(/v1\.[0-9]+)?/networks/create$'
  acl p_network path_reg '^(/v1\.[0-9]+)?/networks/cap[A-Za-z0-9_.-]*$'
  acl p_image_json path_reg '^(/v1\.[0-9]+)?/images/[A-Za-z0-9][A-Za-z0-9_./:@-]*/json$'
  acl p_image_pull path_reg '^(/v1\.[0-9]+)?/images/create$'

  # ---- 带请求体的接口：必须是 JSON、带 Content-Length、不超过 32 KiB、已整个缓冲 ----
  acl p_body path_reg '^(/v1\.[0-9]+)?/(containers/create|containers/cap-[A-Za-z0-9_.-]+/exec|volumes/create|networks/create)$'
  acl json_ct req.hdr(content-type) -m beg application/json
  acl has_te req.hdr(transfer-encoding) -m found
  acl has_cl req.hdr(content-length) -m found
  acl big_body req.hdr_val(content-length) gt 32768
  http-request deny deny_status 403 if m_post p_body !json_ct
  http-request deny deny_status 403 if m_post p_body has_te
  http-request deny deny_status 403 if m_post p_body !has_cl
  http-request deny deny_status 403 if m_post p_body big_body
  http-request set-var(txn.blen) req.body_len if m_post p_body
  acl body_complete req.hdr_val(content-length),sub(txn.blen) eq 0
  http-request deny deny_status 403 if m_post p_body !body_complete

  # ---- 请求体检查（不区分大小写；Docker 的 JSON 键名也不区分大小写）----
  acl b_privileged req.body -m reg -i '"privileged"\s*:\s*true'
  acl b_unicode req.body -m reg '\\u'
  acl b_unicode_key req.body -m reg '"[^"]*\\u[^"]*"\s*:'
  # 非 ASCII：Go 的 JSON 解码按 Unicode 简单大小写折叠匹配键名（"Bindſ" U+017F → Binds，K U+212A → k），
  # ASCII 正则看不出来。建容器 / 卷 / 网络的请求体由插件生成、全是 ASCII，出现任何非 ASCII 字节一律拒绝；
  # exec 的命令可能含中文等，只拒绝键名位置（引号串后紧跟冒号）里的非 ASCII。
  acl b_nonascii req.body -m reg '[^\x00-\x7f]'
  acl b_nonascii_key req.body -m reg '"[^"]*[^\x00-\x7f][^"]*"\s*:'
  acl b_forbidden_key req.body -m reg -i '"(binds|capadd|capabilities|devices|devicerequests|devicecgrouprules|volumesfrom|cgroupparent|cgroup|sysctls|links|annotations|maskedpaths|readonlypaths|portbindings|volumeoptions|driverconfig|bindoptions)"\s*:'
  acl b_mount_type req.body -m reg -i '"type"\s*:\s*"(?!(volume|tmpfs)")'
  # 挂载的卷只能是 cap- 开头的（插件自己建的工作区 / 技能卷），不能挂内核或别的服务的卷
  acl b_mount_source req.body -m reg -i '"source"\s*:\s*"(?!cap-)'
  acl b_host_mode req.body -m reg -i 'mode"\s*:\s*"(host|container:)'
  acl b_publish_all req.body -m reg -i '"publishallports"\s*:\s*true'
  acl b_unconfined req.body -m reg -i '(seccomp|apparmor)[=:]unconfined'
  acl b_secopt req.body -m reg -i '"securityopt"\s*:'
  acl b_secopt_ok req.body -m reg -i '"securityopt"\s*:\s*\[\s*"no-new-privileges(:true)?"\s*\]'
  acl b_runtime_bad req.body -m reg -i '"runtime"\s*:\s*"(?!(runc|runsc)")'
  acl b_netmode req.body -m reg -i '"networkmode"\s*:'
  acl b_netmode_ok req.body -m reg -i '"networkmode"\s*:\s*"(none|cap[a-z0-9_.-]*)"'
  acl b_endpoints req.body -m reg -i '"endpointsconfig"\s*:'
  acl b_endpoints_ok req.body -m reg -i '"endpointsconfig"\s*:\s*\{(\s*"cap[a-z0-9_.-]*"\s*:\s*\{\s*\}\s*,?)*\s*\}'
  # 重复的键（Go 取最后一个）可能绕过「必须是某值」的检查：一律拒绝
  acl b_dup_key req.body -m reg -i '"(?<k>hostconfig|networkingconfig|networkmode|securityopt|endpointsconfig|name|driver)"\s*:[\s\S]*"\k<k>"\s*:'
  acl b_name_cap req.body -m reg -i '"name"\s*:\s*"cap-[a-z0-9_.-]+"'
  acl b_netname_cap req.body -m reg -i '"name"\s*:\s*"cap[a-z0-9_.-]*"'
  acl b_local_opts req.body -m reg -i '"(device|o|type)"\s*:'
  acl b_driver_bad req.body -m reg -i '"driver"\s*:\s*"(?!bridge")'
  acl q_name_cap urlp(name) -m reg '^cap-[A-Za-z0-9_.-]+$'
  acl q_dup_name query -m reg '(^|&)name=[^&]*&(.*&)?name='
  acl q_pull_only query -m reg '^fromImage=[^&]+$'

  # 建容器：名字 cap-…，网络只能是 none 或 cap… 网络，其余危险字段一概拒绝
  http-request deny deny_status 403 if m_post p_container_create !q_name_cap
  http-request deny deny_status 403 if m_post p_container_create q_dup_name
  http-request deny deny_status 403 if m_post p_container_create b_unicode
  http-request deny deny_status 403 if m_post p_container_create b_nonascii
  http-request deny deny_status 403 if m_post p_container_create b_privileged
  http-request deny deny_status 403 if m_post p_container_create b_forbidden_key
  http-request deny deny_status 403 if m_post p_container_create b_mount_type
  http-request deny deny_status 403 if m_post p_container_create b_mount_source
  http-request deny deny_status 403 if m_post p_container_create b_host_mode
  http-request deny deny_status 403 if m_post p_container_create b_publish_all
  http-request deny deny_status 403 if m_post p_container_create b_unconfined
  http-request deny deny_status 403 if m_post p_container_create b_secopt !b_secopt_ok
  http-request deny deny_status 403 if m_post p_container_create b_runtime_bad
  http-request deny deny_status 403 if m_post p_container_create !b_netmode
  http-request deny deny_status 403 if m_post p_container_create !b_netmode_ok
  http-request deny deny_status 403 if m_post p_container_create b_endpoints !b_endpoints_ok
  http-request deny deny_status 403 if m_post p_container_create b_dup_key
  # 建 exec：不能特权；命令里可能有控制字符（\u 转义），只拒绝键名里的 \u
  http-request deny deny_status 403 if m_post p_container_exec b_privileged
  http-request deny deny_status 403 if m_post p_container_exec b_unicode_key
  http-request deny deny_status 403 if m_post p_container_exec b_nonascii_key
  # 建卷：名字 cap-…，不能带 local 驱动的 device / o / type（可做成 bind 挂载）
  http-request deny deny_status 403 if m_post p_volume_create b_unicode
  http-request deny deny_status 403 if m_post p_volume_create b_nonascii
  http-request deny deny_status 403 if m_post p_volume_create !b_name_cap
  http-request deny deny_status 403 if m_post p_volume_create b_dup_key
  http-request deny deny_status 403 if m_post p_volume_create b_local_opts
  # 建网络：名字 cap…，只能是 bridge
  http-request deny deny_status 403 if m_post p_network_create b_unicode
  http-request deny deny_status 403 if m_post p_network_create b_nonascii
  http-request deny deny_status 403 if m_post p_network_create !b_netname_cap
  http-request deny deny_status 403 if m_post p_network_create b_dup_key
  http-request deny deny_status 403 if m_post p_network_create b_driver_bad

  # 拉镜像：查询串只能是一个 fromImage（fromSrc 会从 URL / 请求体导入任意文件系统，repo / tag 会改名覆盖镜像）
  http-request deny deny_status 403 if m_post p_image_pull !q_pull_only

  # ---- 路径白名单 ----
  http-request allow if m_get p_ping
  http-request allow if m_post p_container_create
  http-request allow if m_get p_container_json
  http-request allow if m_post p_container_op
  http-request allow if m_delete p_container
  http-request allow if m_post p_container_exec
  http-request allow if m_post p_exec_start
  http-request allow if m_get p_exec_json
  http-request allow if m_post p_volume_create
  http-request allow if m_get p_volume
  http-request allow if m_delete p_volume
  http-request allow if m_post p_network_create
  http-request allow if m_get p_network
  http-request allow if m_delete p_network
  http-request allow if m_get p_image_json
  http-request allow if m_post p_image_pull
  http-request deny deny_status 403

  default_backend dockerd

backend dockerd
  server dockerd /var/run/docker.sock
