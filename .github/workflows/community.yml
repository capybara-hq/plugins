# Community issue gate: calls the shared gate workflow from capybara-hq/.github.
# PR events arrive through workflow_run after pr-event.yml (an unprivileged pull_request workflow)
# recorded the PR number; workflow_run runs this file from the default branch with a write token
# and must never check out or run the PR's code: the shared workflow only reads PR metadata through
# the GitHub API. It sets the commit status `issue-linked` on PR heads.
name: community
on:
  workflow_run:
    workflows: [pr-event]
    types: [completed]
  issues:
    types: [opened, edited, labeled, unlabeled, assigned, unassigned, closed, reopened]
  issue_comment:
    types: [created]
permissions: {}
jobs:
  gate:
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write
      statuses: write
    uses: capybara-hq/.github/.github/workflows/gate.yml@v2
